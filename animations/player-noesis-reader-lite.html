<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noesis Reader Lite — HyperFrames</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0c11;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      }
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      #film {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1920px;
        height: 1080px;
        border: 0;
        transform-origin: center center;
        background: #f3ecdf;
      }
      .tag {
        position: absolute;
        left: 18px;
        bottom: 14px;
        padding: 7px 13px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(10, 12, 17, 0.55);
        color: #b9c2d4;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        backdrop-filter: blur(6px);
      }
      .tag b {
        color: #f3b27a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <iframe id="film" src="noesis-reader-lite/index.html?play=1" title="Noesis Reader Lite — animazione HyperFrames"></iframe>
      <div class="tag"><b>HyperFrames</b> · Noesis Reader Lite</div>
    </div>
    <script>
      const film = document.getElementById("film");
      function fit() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        film.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
      window.addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
