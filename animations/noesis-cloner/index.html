<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Noesis Cloner — un libro, due lingue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f3ecdf;
        --ink: #1b2334;
        --muted: #6d6656;
        --indigo: #4a55a8;
        --cyan: #37c4d8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      text {
        font-family: "Outfit", "Trebuchet MS", sans-serif;
      }
      .label {
        font-family: "Plus Jakarta Sans", "Trebuchet MS", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="noesis-cloner"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <svg id="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGlow" cx="58%" cy="34%" r="70%">
              <stop offset="0%" stop-color="#fbf6ea" />
              <stop offset="62%" stop-color="#f3ecdf" />
              <stop offset="100%" stop-color="#e9dfcb" />
            </radialGradient>

            <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a4560" />
              <stop offset="55%" stop-color="#232c42" />
              <stop offset="100%" stop-color="#161d2c" />
            </linearGradient>

            <linearGradient id="metalLight" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#4a5675" />
              <stop offset="50%" stop-color="#2a3450" />
              <stop offset="100%" stop-color="#3d4967" />
            </linearGradient>

            <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0a1120" />
              <stop offset="70%" stop-color="#101a2e" />
              <stop offset="100%" stop-color="#16233c" />
            </linearGradient>

            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9fe9f4" stop-opacity="0.34" />
              <stop offset="45%" stop-color="#c8f5fb" stop-opacity="0.12" />
              <stop offset="100%" stop-color="#6fd2e4" stop-opacity="0.26" />
            </linearGradient>

            <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#59e6ff" stop-opacity="0" />
              <stop offset="22%" stop-color="#59e6ff" stop-opacity="0.9" />
              <stop offset="78%" stop-color="#59e6ff" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#59e6ff" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="scanColumnGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#59e6ff" stop-opacity="0" />
              <stop offset="50%" stop-color="#59e6ff" stop-opacity="0.16" />
              <stop offset="100%" stop-color="#59e6ff" stop-opacity="0.03" />
            </linearGradient>

            <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5b67c9" />
              <stop offset="100%" stop-color="#3f4a97" />
            </linearGradient>

            <linearGradient id="paperSide" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fdf8ec" />
              <stop offset="100%" stop-color="#e9dfc9" />
            </linearGradient>

            <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a2416" flood-opacity="0.22" />
            </filter>

            <filter id="glow" x="-80%" y="-200%" width="260%" height="500%">
              <feGaussianBlur stdDeviation="9" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="badgeShadow" x="-30%" y="-60%" width="160%" height="220%">
              <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b2334" flood-opacity="0.18" />
            </filter>
          </defs>

          <!-- background -->
          <rect width="1920" height="1080" fill="url(#bgGlow)" />
          <circle cx="1010" cy="470" r="470" fill="#efe5d2" opacity="0.55" />
          <circle cx="1010" cy="470" r="350" fill="#f7f0e1" opacity="0.6" />

          <!-- floor -->
          <rect x="0" y="900" width="1920" height="180" fill="#e7ddc9" />
          <rect x="0" y="900" width="1920" height="4" fill="#d9cdb5" />
          <g stroke="#c9bda4" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.8">
            <path d="M240 952 H760" />
            <path d="M1240 952 H1700" />
          </g>
          <g fill="#b9ac93">
            <path d="M700 944 l22 16 l-22 16 z" />
            <path d="M1220 944 l22 16 l-22 16 z" />
          </g>

          <!-- headline -->
          <text id="kicker" class="label" x="112" y="122" font-size="22" font-weight="600" letter-spacing="6" fill="#706858">NOESIS ECOSYSTEM</text>
          <text id="bookTitle" x="108" y="196" font-size="62" font-weight="800" letter-spacing="-1.6" fill="#1b2334">Un libro, due lingue</text>
          <text id="subtitle" class="label" x="112" y="242" font-size="25" font-weight="500" fill="#6d6656">Entra in inglese, esce in italiano. L'impaginazione non cambia.</text>

          <!-- machine: back -->
          <g id="machineBack">
            <rect x="1040" y="360" width="300" height="510" rx="10" fill="url(#cavity)" />
            <rect x="1060" y="380" width="260" height="470" rx="6" fill="none" stroke="#22304a" stroke-width="2" />
            <g fill="#2a3a56">
              <rect x="1080" y="404" width="100" height="7" rx="3" />
              <rect x="1080" y="422" width="150" height="7" rx="3" />
              <rect x="1080" y="440" width="120" height="7" rx="3" />
            </g>
            <rect id="scanColumn" x="1040" y="360" width="300" height="510" fill="url(#scanColumnGradient)" opacity="0" />
          </g>

          <!-- book character -->
          <g id="book">
            <ellipse id="bookShadow" cx="0" cy="8" rx="98" ry="17" fill="#3a2f1c" opacity="0.16" />

            <g id="bookBob">
              <!-- legs -->
              <g id="legL">
                <rect x="-44" y="-62" width="28" height="62" rx="13" fill="#2f3860" />
                <ellipse cx="-30" cy="1" rx="26" ry="11" fill="#1b2334" />
              </g>
              <g id="legR">
                <rect x="16" y="-62" width="28" height="62" rx="13" fill="#2f3860" />
                <ellipse cx="30" cy="1" rx="26" ry="11" fill="#1b2334" />
              </g>

              <!-- flags -->
              <g id="flagIt" opacity="1">
                <rect x="88" y="-388" width="7" height="160" rx="3.5" fill="#8b6a4a" />
                <circle cx="91.5" cy="-392" r="6" fill="#c9a06f" />
                <g id="itCloth">
                  <rect x="95" y="-384" width="26" height="60" fill="#2f9e63" />
                  <rect x="121" y="-384" width="26" height="60" fill="#f7f4ec" />
                  <rect x="147" y="-384" width="26" height="60" fill="#d94b45" />
                  <path d="M95 -384 h78 v60 h-78 z" fill="none" stroke="#d8cdb8" stroke-width="1.5" />
                </g>
              </g>

              <g id="flagEn" opacity="0">
                <rect x="88" y="-388" width="7" height="160" rx="3.5" fill="#8b6a4a" />
                <circle cx="91.5" cy="-392" r="6" fill="#c9a06f" />
                <g id="enCloth">
                  <rect x="95" y="-384" width="78" height="60" fill="#26356b" />
                  <path d="M95 -384 L173 -324 M173 -384 L95 -324" stroke="#f7f4ec" stroke-width="13" />
                  <path d="M95 -384 L173 -324 M173 -384 L95 -324" stroke="#d94b45" stroke-width="6" />
                  <path d="M134 -384 V-324 M95 -354 H173" stroke="#f7f4ec" stroke-width="18" />
                  <path d="M134 -384 V-324 M95 -354 H173" stroke="#d94b45" stroke-width="10" />
                  <path d="M95 -384 h78 v60 h-78 z" fill="none" stroke="#d8cdb8" stroke-width="1.5" />
                </g>
              </g>

              <!-- body -->
              <g id="body">
                <rect x="-78" y="-306" width="156" height="246" rx="14" fill="url(#cover)" filter="url(#softShadow)" />
                <rect x="-78" y="-306" width="20" height="246" rx="8" fill="#39428f" />
                <rect x="58" y="-292" width="8" height="218" rx="4" fill="#e9e4d2" opacity="0.85" />
                <rect x="-60" y="-290" width="116" height="214" rx="8" fill="none" stroke="#a9b0ef" stroke-width="2" opacity="0.45" />

                <circle cx="-26" cy="-206" r="8" fill="#171d2c" />
                <circle cx="26" cy="-206" r="8" fill="#171d2c" />
                <circle cx="-23.5" cy="-209" r="2.6" fill="#ffffff" />
                <circle cx="28.5" cy="-209" r="2.6" fill="#ffffff" />
                <path d="M-38 -226 Q-26 -234 -14 -226" fill="none" stroke="#171d2c" stroke-width="4" stroke-linecap="round" />
                <path d="M14 -226 Q26 -234 38 -226" fill="none" stroke="#171d2c" stroke-width="4" stroke-linecap="round" />
                <path d="M-14 -178 Q0 -166 14 -178" fill="none" stroke="#171d2c" stroke-width="4.5" stroke-linecap="round" />
                <ellipse cx="-44" cy="-190" rx="9" ry="5" fill="#e88f8f" opacity="0.35" />
                <ellipse cx="44" cy="-190" rx="9" ry="5" fill="#e88f8f" opacity="0.35" />
              </g>

              <!-- arms -->
              <g id="armL">
                <path d="M-70 -272 Q-104 -248 -104 -214" fill="none" stroke="#3f4a97" stroke-width="18" stroke-linecap="round" />
                <circle cx="-104" cy="-208" r="12" fill="#f2c9a0" />
              </g>
              <g id="armR">
                <path d="M70 -272 Q96 -254 92 -232" fill="none" stroke="#3f4a97" stroke-width="18" stroke-linecap="round" />
                <circle cx="92" cy="-228" r="12" fill="#f2c9a0" />
              </g>
            </g>
          </g>

          <!-- machine: front -->
          <g id="machineFront">
            <rect x="960" y="360" width="80" height="520" rx="24" fill="url(#metalLight)" filter="url(#softShadow)" />
            <rect x="1340" y="360" width="80" height="520" rx="24" fill="url(#metalLight)" filter="url(#softShadow)" />
            <rect x="976" y="380" width="8" height="470" rx="4" fill="#6b7a9e" opacity="0.5" />
            <rect x="1396" y="380" width="8" height="470" rx="4" fill="#6b7a9e" opacity="0.5" />

            <rect x="940" y="280" width="500" height="110" rx="28" fill="url(#metal)" filter="url(#softShadow)" />
            <rect x="962" y="294" width="456" height="10" rx="5" fill="#5d6c8f" opacity="0.55" />
            <text x="1190" y="342" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="4" fill="#f4eddf">NOESIS CLONER</text>
            <text class="label" x="1190" y="374" text-anchor="middle" font-size="28" font-weight="600" letter-spacing="3" fill="#a3b4cf">EN → IT · PDF → PDF</text>
            <circle id="statusLight" cx="978" cy="335" r="9" fill="#ff6b5a" />
            <circle cx="1202" cy="300" r="4" fill="#8fa3c4" />

            <rect x="968" y="560" width="64" height="112" rx="10" fill="#0a1020" stroke="#3b4a68" stroke-width="2" />
            <g fill="#59e6ff" opacity="0.8">
              <rect x="980" y="576" width="40" height="5" rx="2.5" />
              <rect x="980" y="590" width="28" height="5" rx="2.5" />
              <rect x="980" y="604" width="34" height="5" rx="2.5" />
            </g>
            <circle cx="1000" cy="646" r="9" fill="#59e6ff" opacity="0.55" />

            <rect x="940" y="860" width="500" height="54" rx="18" fill="url(#metal)" />
            <rect x="988" y="908" width="70" height="14" rx="7" fill="#1a2233" />
            <rect x="1322" y="908" width="70" height="14" rx="7" fill="#1a2233" />

            <rect x="1040" y="360" width="300" height="510" fill="url(#glass)" />
            <g stroke="#d9fbff" stroke-width="2" opacity="0.35">
              <path d="M1064 380 L1104 380 L1064 470 Z" fill="#e8fdff" stroke="none" opacity="0.16" />
              <path d="M1260 850 L1316 850 L1316 730 Z" fill="#e8fdff" stroke="none" opacity="0.12" />
            </g>

            <g id="scanLine" opacity="0">
              <rect x="1040" y="356" width="300" height="7" rx="3.5" fill="url(#scan)" filter="url(#glow)" />
            </g>
            <rect id="flash" x="1040" y="360" width="300" height="510" fill="#bff6ff" opacity="0" />
          </g>

          <!-- badge -->
          <g id="badge" opacity="0" filter="url(#badgeShadow)">
            <rect x="1028" y="178" width="324" height="74" rx="37" fill="#f7f2e6" stroke="#cfc4ab" stroke-width="2" />
            <circle cx="1066" cy="215" r="17" fill="#2f9e63" />
            <path d="M1058 215 l6 7 l11 -14" fill="none" stroke="#f7f2e6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <text class="label" x="1096" y="223" font-size="22" font-weight="700" letter-spacing="2.6" fill="#1b2334">LAYOUT INTATTO</text>
          </g>

          <!-- caption -->
          <text id="caption" class="label" x="960" y="1032" text-anchor="middle" font-size="24" font-weight="500" fill="#7a7160" opacity="0">Stesso libro, stessa impaginazione, un'altra lingua.</text>

          <!-- floating specks -->
          <g fill="#b7a988" opacity="0.5">
            <circle id="mote1" cx="760" cy="520" r="4" />
            <circle id="mote2" cx="1450" cy="470" r="3" />
            <circle id="mote3" cx="900" cy="700" r="2.6" />
            <circle id="mote4" cx="1520" cy="680" r="3.4" />
          </g>
        </svg>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      gsap.set("#book", { x: 120, y: 890, opacity: 1, rotation: 0 });
      gsap.set("#bookBob", { y: 0 });
      gsap.set("#legL", { transformOrigin: "50% 0%", rotation: 0 });
      gsap.set("#legR", { transformOrigin: "50% 0%", rotation: 0 });
      gsap.set("#armL", { transformOrigin: "80% 0%", rotation: 0 });
      gsap.set("#armR", { transformOrigin: "20% 0%", rotation: 0 });
      gsap.set("#flagIt", { opacity: 0 });
      gsap.set("#flagEn", { opacity: 1 });
      gsap.set("#itCloth", { transformOrigin: "0% 50%", rotation: 0 });
      gsap.set("#enCloth", { transformOrigin: "0% 50%", rotation: 0 });
      gsap.set("#scanLine", { y: 0, opacity: 0 });
      gsap.set("#scanColumn", { opacity: 0 });
      gsap.set("#flash", { opacity: 0 });
      gsap.set("#badge", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" });
      gsap.set("#caption", { opacity: 0, y: 14 });
      gsap.set("#bookTitle", { opacity: 0, y: -16 });
      gsap.set("#subtitle", { opacity: 0, y: -10 });
      gsap.set("#statusLight", { fill: "#ff6b5a" });

      /* opening */
      tl.to("#bookTitle", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      tl.to("#subtitle", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);

      /* walk in */
      tl.fromTo("#book", { x: 120 }, { x: 930, duration: 2.55, ease: "none" }, 0.45);
      tl.to("#legL", { rotation: 17, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.45);
      tl.to("#legR", { rotation: -17, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.45);
      tl.to("#armL", { rotation: 14, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.45);
      tl.to("#armR", { rotation: -9, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.45);
      tl.to("#bookBob", { y: -9, duration: 0.15, repeat: 15, yoyo: true, ease: "sine.inOut" }, 0.45);
      tl.to("#enCloth", { rotation: 3.2, duration: 0.7, repeat: 6, yoyo: true, ease: "sine.inOut" }, 0.45);

      /* pause and look up */
      tl.to(["#legL", "#legR", "#armL", "#armR"], { rotation: 0, duration: 0.3, ease: "power2.out" }, 2.95);
      tl.to("#bookBob", { y: 0, duration: 0.2 }, 2.95);
      tl.to("#book", { rotation: -1.4, duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.0);

      /* into the scanner */
      tl.to("#book", { x: 1185, duration: 1.5, ease: "none" }, 3.4);
      tl.to("#legL", { rotation: 17, duration: 0.29, repeat: 4, yoyo: true, ease: "sine.inOut" }, 3.4);
      tl.to("#legR", { rotation: -17, duration: 0.29, repeat: 4, yoyo: true, ease: "sine.inOut" }, 3.4);
      tl.to("#armL", { rotation: 12, duration: 0.29, repeat: 4, yoyo: true, ease: "sine.inOut" }, 3.4);
      tl.to("#bookBob", { y: -7, duration: 0.145, repeat: 9, yoyo: true, ease: "sine.inOut" }, 3.4);

      /* scan */
      tl.to("#statusLight", { fill: "#4ade80", duration: 0.2 }, 3.7);
      tl.to("#scanColumn", { opacity: 1, duration: 0.35 }, 3.75);
      tl.fromTo("#scanLine", { y: 0, opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.15);
      tl.to("#scanLine", { y: 480, duration: 0.95, ease: "none" }, 4.35);
      tl.to("#scanLine", { opacity: 0, duration: 0.2 }, 5.3);
      tl.to("#scanColumn", { opacity: 0, duration: 0.45 }, 5.25);

      /* flash and swap flag while the book is inside */
      tl.to("#flash", { opacity: 0.75, duration: 0.12 }, 5.15);
      tl.to("#flash", { opacity: 0, duration: 0.38 }, 5.3);
      tl.to("#book", { opacity: 0, duration: 0.22 }, 5.12);
      tl.set("#flagIt", { opacity: 1 }, 5.3);
      tl.set("#flagEn", { opacity: 0 }, 5.3);
      tl.set("#book", { x: 1185, opacity: 1 }, 5.42);

      /* walk out with the new flag */
      tl.to("#book", { x: 1645, duration: 1.55, ease: "none" }, 5.45);
      tl.to("#legL", { rotation: 17, duration: 0.3, repeat: 4, yoyo: true, ease: "sine.inOut" }, 5.45);
      tl.to("#legR", { rotation: -17, duration: 0.3, repeat: 4, yoyo: true, ease: "sine.inOut" }, 5.45);
      tl.to("#armL", { rotation: 14, duration: 0.3, repeat: 4, yoyo: true, ease: "sine.inOut" }, 5.45);
      tl.to("#bookBob", { y: -9, duration: 0.15, repeat: 9, yoyo: true, ease: "sine.inOut" }, 5.45);
      tl.to("#itCloth", { rotation: 3.4, duration: 0.7, repeat: 3, yoyo: true, ease: "sine.inOut" }, 5.45);
      tl.to("#statusLight", { fill: "#ff6b5a", duration: 0.2 }, 7.0);

      /* landing and celebration */
      tl.to(["#legL", "#legR", "#armL", "#armR"], { rotation: 0, duration: 0.3, ease: "power2.out" }, 7.0);
      tl.to("#bookBob", { y: 0, duration: 0.2 }, 7.0);
      tl.to("#bookBob", { y: -24, duration: 0.24, yoyo: true, repeat: 1, ease: "power2.out" }, 7.24);
      tl.to("#book", { rotation: 1.2, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 7.15);
      tl.to("#badge", { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 7.25);
      tl.to("#caption", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.7);

      /* idle life */
      tl.to("#bookBob", { y: -4, duration: 1.1, yoyo: true, repeat: 2, ease: "sine.inOut" }, 8.4);
      tl.to("#itCloth", { rotation: 2.4, duration: 1.0, yoyo: true, repeat: 2, ease: "sine.inOut" }, 8.4);
      tl.to("#scanColumn", { opacity: 0.28, duration: 1.0, yoyo: true, repeat: 2, ease: "sine.inOut" }, 8.4);
      tl.to("#mote1", { y: -40, duration: 2.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);
      tl.to("#mote2", { y: -55, duration: 3.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.6);
      tl.to("#mote3", { y: -34, duration: 2.8, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.2);
      tl.to("#mote4", { y: -48, duration: 3.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["noesis-cloner"] = tl;
      tl.seek(0);

      // Standalone viewing (?play=1): loop the film. Studio and renders stay paused/seekable.
      if (new URLSearchParams(location.search).get("play") === "1") {
        tl.repeat(-1);
        tl.play(0);
      }
    </script>
  </body>
</html>
