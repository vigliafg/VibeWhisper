<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un uomo che legge — VibeWhisper</title>
  <meta name="description" content="Illustrazione animata in SVG e CSS: un uomo legge un libro, respira, sbatte le palpebre e gira una pagina.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06080d;
      --text: #eef1f8;
      --dim: #8b94a8;
      --accent: #f3b27a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      align-items: safe center;
      justify-items: center;
      padding: 24px 18px;
      background:
        radial-gradient(900px 600px at 50% 30%, rgba(129, 140, 248, 0.08), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    .stage {
      width: min(100%, 620px);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 6px 14px;
      border: 1px solid rgba(243, 178, 122, 0.28);
      border-radius: 999px;
      background: rgba(243, 178, 122, 0.08);
      color: var(--accent);
      font-family: "Outfit", sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    h1 {
      margin: 0 0 8px;
      font-family: "Outfit", sans-serif;
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 auto 16px;
      max-width: 44ch;
      color: var(--dim);
      font-size: 0.86rem;
      line-height: 1.65;
    }

    .scene-shell {
      width: min(100%, 54vh, 500px);
      margin: 0 auto;
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: #0a0d16;
      box-shadow:
        0 30px 80px -30px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .reading-scene {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---- Animations ---- */

    .breathe {
      animation: breathe 5.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 300px 560px;
    }

    .head {
      animation: nod 7s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 300px 352px;
    }

    .eye {
      animation: blink 5.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .eye.right { animation-delay: 0.06s; }

    .lamp-glow {
      animation: lamp 7s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .turn-page {
      animation: page-turn 9.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      transform-box: view-box;
      transform-origin: 300px 448px;
      backface-visibility: hidden;
    }

    .right-static {
      animation: right-page 9.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }

    .mote {
      animation: float 12s linear infinite;
      opacity: 0;
    }

    .mote:nth-child(2) { animation-duration: 15s; animation-delay: 1.4s; }
    .mote:nth-child(3) { animation-duration: 11s; animation-delay: 3.6s; }
    .mote:nth-child(4) { animation-duration: 17s; animation-delay: 5.2s; }
    .mote:nth-child(5) { animation-duration: 13s; animation-delay: 7.1s; }
    .mote:nth-child(6) { animation-duration: 16s; animation-delay: 2.3s; }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3.5px) scale(1.006); }
    }

    @keyframes nod {
      0%, 100% { transform: rotate(-1.1deg); }
      50% { transform: rotate(1.4deg); }
    }

    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(1); }
      93.5%, 95.5% { transform: scaleY(0.08); }
    }

    @keyframes lamp {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.82; transform: scale(1.035); }
    }

    @keyframes page-turn {
      0%, 54% { transform: translateY(0) rotateY(0deg); opacity: 1; }
      62% { transform: translateY(-3px) rotateY(-34deg); opacity: 1; }
      74% { transform: translateY(-4px) rotateY(-122deg); opacity: 1; }
      83%, 100% { transform: translateY(-2px) rotateY(-178deg); opacity: 0; }
    }

    @keyframes right-page {
      0%, 56% { opacity: 1; }
      60%, 86% { opacity: 0; }
      92%, 100% { opacity: 1; }
    }

    @keyframes float {
      0% { transform: translateY(10px); opacity: 0; }
      18% { opacity: 0.55; }
      70% { opacity: 0.28; }
      100% { transform: translateY(-78px); opacity: 0; }
    }

    .note {
      margin: 18px 0 0;
      color: var(--dim);
      font-size: 0.78rem;
      letter-spacing: 0.01em;
    }

    .note span {
      color: var(--accent);
      font-family: "Outfit", sans-serif;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      .breathe,
      .head,
      .eye,
      .lamp-glow,
      .turn-page,
      .right-static,
      .mote {
        animation: none !important;
      }
      .mote { opacity: 0.25; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <div class="eyebrow">Animazione</div>
    <h1>Un uomo che legge</h1>
    <p class="subtitle">
      Una scena disegnata a mano in SVG: la luce della lampada pulsa, il respiro muove le spalle,
      le palpebre si chiudono e ogni tanto una pagina gira.

            <stop offset="0%" stop-color="#f7d2ac"/>
            <stop offset="100%" stop-color="#eab988"/>

          <path d="M241 288 C236 224 269 204 301 204 C338 204 365 229 362 288

        </g>

        <g class="book" filter="url(#softShadow)">

            <g fill="none" stroke="#cdb58d" stroke-width="2.1" stroke-linecap="round" opacity="0.55">

              <path d="M394 482 Q350 474 318 484"/>

          <path d="M236 462 Q206 486 208 522 L232 526 Q230 494 256 474 Z" fill="#4a55a3"/>
          <path d="M364 462 Q394 486 392 522 L368 526 Q370 494 344 474 Z" fill="#4a55a3"/>
          <ellipse cx="206" cy="508" rx="23" ry="19" fill="#f0c299"/>
          <ellipse cx="394" cy="508" rx="23" ry="19" fill="#f0c299"/>

        </g>
      </svg>
    </div>

    <p class="note"><span>SVG + CSS</span> · loop continuo · preferenze di movimento rispettate</p>
  </main>

</body>
</html>
